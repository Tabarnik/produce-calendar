<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Montreal Produce Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Look: a Sicilian-pantry market sheet. Cream paper, burgundy ink, orange display serif, peach cards, illustrated produce. */
:root {
  --bg: #fdf3eb; --paper: #fffaf6; --card2: #ffe9d7; --card3: #f8dcc6;
  --ink: #762530; --muted: #8e4f55; --rule: #f0d8c8;
  --accent: #e94e1b; --accent-ink: #c23c12; --on-accent: #fff6ee;
  --peak: #e94e1b; --fresh: #f6b08a; --store: #c9a27a; --store-bg: #f6e6d6; --green: #5f8f36;
  --can: #e94e1b; --can2: #f6b08a; --imp: #762530; --imp2: #d9a3a6;
  --cheap: #2f7a3e; --dear: #b23a2a; --money: #c23c12; --deal-bg: #ffe9d7;
  --now: #762530; --now-ink: #fff6ee; --chip: #ffe9d7;
  --display: "Italiana", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Figtree", "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1113; --paper: #26171a; --card2: #351f23; --card3: #42282c;
    --ink: #fbe9dc; --muted: #d4ada4; --rule: #45292d;
    --accent: #ff7a45; --accent-ink: #ff8a5a; --on-accent: #1d1113;
    --peak: #ff6a33; --fresh: #9c4a2c; --store: #b98f65; --store-bg: #3a2620; --green: #8dbb4c;
    --can: #ff6a33; --can2: #9c4a2c; --imp: #e38a95; --imp2: #6a3238;
    --cheap: #8fd39a; --dear: #ff9a84; --money: #ff8a5a; --deal-bg: #351f23;
    --now: #fbe9dc; --now-ink: #1d1113; --chip: #3a2226; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1113; --paper: #26171a; --card2: #351f23; --card3: #42282c;
  --ink: #fbe9dc; --muted: #d4ada4; --rule: #45292d;
  --accent: #ff7a45; --accent-ink: #ff8a5a; --on-accent: #1d1113;
  --peak: #ff6a33; --fresh: #9c4a2c; --store: #b98f65; --store-bg: #3a2620; --green: #8dbb4c;
  --can: #ff6a33; --can2: #9c4a2c; --imp: #e38a95; --imp2: #6a3238;
  --cheap: #8fd39a; --dear: #ff9a84; --money: #ff8a5a; --deal-bg: #351f23;
  --now: #fbe9dc; --now-ink: #1d1113; --chip: #3a2226; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 28px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }

/* Masthead */
.mast { display: grid; justify-items: center; text-align: center; gap: 18px; padding-top: 8px; }
.brand { display: grid; justify-items: center; gap: 8px; }
.mark { width: 64px; height: 64px; border-radius: 50%; background: var(--card2); display: grid; place-items: center; }
.mark svg { width: 44px; height: 44px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 400; text-transform: uppercase; color: var(--accent); font-size: clamp(48px, 10vw, 128px); line-height: 0.92; letter-spacing: 0.01em; margin: 0; text-wrap: balance; }
.lede { margin: 0; max-width: 46ch; font-size: clamp(17px, 2vw, 21px); line-height: 1.45; color: var(--ink); }
.diamond { width: 8px; height: 8px; background: var(--ink); transform: rotate(45deg); }
h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; color: var(--accent); font-size: clamp(34px, 5vw, 60px); line-height: 1; letter-spacing: 0.01em; margin: 0; }
h3 { font-family: var(--display); font-weight: 400; }

/* Controls */
.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; align-items: center; }
.storepick { display: inline-flex; align-items: center; gap: 8px; background: var(--paper); border: 1px solid var(--rule); border-radius: 999px; padding: 4px 4px 4px 16px; font-size: 13px; font-weight: 600; color: var(--muted); }
.storepick select { font: inherit; font-weight: 600; color: var(--on-accent); background: var(--accent-ink); border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.toggle { background: var(--paper); border: 1px solid var(--rule); display: inline-flex; align-items: center; gap: 10px; padding: 7px 16px 7px 8px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; user-select: none; position: relative; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle .track { width: 40px; height: 24px; border-radius: 999px; background: var(--card3); position: relative; transition: background .2s; flex: none; }
.toggle .knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--paper); box-shadow: 0 1px 2px rgba(90,29,38,.25); transition: left .2s; }
.toggle input:checked + .track { background: var(--accent-ink); }
.toggle input:checked + .track .knob { left: 19px; }
.toggle input:focus-visible + .track, .storepick select:focus-visible, .tabs button:focus-visible, .picker button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.tabs { display: flex; gap: 4px; background: var(--card2); border-radius: 999px; padding: 5px; width: fit-content; max-width: 100%; margin: 6px auto 0; }
.tabs button { font: inherit; font-weight: 600; font-size: 14px; color: var(--ink); background: transparent; border: 0; border-radius: 999px; padding: 10px 20px; cursor: pointer; white-space: nowrap; }
.tabs button:hover { background: var(--card3); }
.tabs button[aria-selected="true"] { background: var(--accent-ink); color: var(--on-accent); }
.tab { display: grid; gap: 22px; }
.tab[hidden] { display: none; }

/* Cards */
.card, .sheet, .month { background: var(--paper); border: 1px solid var(--rule); border-radius: 16px; }
.sheet { padding: 20px 22px; }
.hero { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 32px; align-items: center; padding: 28px 34px; background: var(--card2); border: 0; }
.hero h2 { margin: 0 0 12px; font-size: clamp(32px, 4vw, 52px); }
.blurb { margin: 0; font-size: 17px; line-height: 1.65; }
.blurb b { font-weight: 700; }
.blurb .money { color: var(--on-accent); background: var(--accent-ink); border-radius: 999px; padding: 1px 9px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.blurb small { display: block; margin-top: 8px; font-size: 12px; color: var(--muted); }
.basket { position: relative; width: 280px; height: 230px; margin: 0 auto; }
.basket .fr { position: absolute; width: 74px; height: 74px; z-index: 1; filter: drop-shadow(0 4px 4px rgba(90,29,38,.18)); }
.basket .fr svg, .basket .bk svg { width: 100%; height: 100%; display: block; }
.basket .bk { position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); width: 210px; height: 170px; z-index: 0; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; padding: 22px; text-align: center; } .basket { width: 240px; height: 200px; } .basket .fr { width: 62px; height: 62px; } .basket .bk { width: 180px; height: 146px; } }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--paper); border: 1px solid var(--rule); border-radius: 16px; padding: 20px 22px; display: grid; gap: 8px; align-content: start; min-width: 0; position: relative; overflow: hidden; }
.kpi b { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 3.6vw, 46px); line-height: 1; overflow-wrap: anywhere; text-transform: uppercase; }
.kpi span { font-size: 13.5px; color: var(--muted); }
.kpi .kico { width: 54px; height: 54px; }
.kpi .kico svg { width: 100%; height: 100%; }
.kpi.lime { background: var(--accent-ink); border-color: var(--accent-ink); color: var(--on-accent); }
.kpi.sun { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.kpi.lime span, .kpi.sun span { color: inherit; opacity: 0.85; }
.kpi.lime .kico { background: var(--on-accent); border-radius: 50%; padding: 6px; }

/* Deals as a pantry shelf */
.dl { padding: 26px 26px 30px; }
.sechead { display: grid; justify-items: center; text-align: center; gap: 8px; margin: 0 0 22px; }
.sechead em { font-style: normal; font-size: 13px; color: var(--muted); }
.deals { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.deals li { background: var(--card2); border-radius: 16px; padding: 16px 16px 18px; display: grid; grid-template-rows: auto auto 1fr; gap: 10px; min-width: 0; }
.deals .pimg { aspect-ratio: 4 / 3; border-radius: 12px; background: var(--paper); display: grid; place-items: center; position: relative; }
.deals .pimg svg { width: 58%; height: auto; max-height: 92%; }
.deals .pimg .why { position: absolute; top: 10px; left: 10px; }
.deals .dn b { display: block; font-family: var(--display); font-weight: 400; font-size: 25px; line-height: 1.05; text-transform: uppercase; }
.deals small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
.deals .dp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; align-self: end; }
.deals .dp small { margin: 0; flex-basis: 100%; }
.deals .sw { width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; display: inline-block; vertical-align: 1px; }
.deals .pill { display: inline-block; background: var(--accent-ink); color: var(--on-accent); border-radius: 999px; padding: 5px 12px; font-weight: 600; font-size: 14px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.deals .save { background: var(--ink); color: var(--bg); border-radius: 999px; padding: 4px 10px; font-weight: 600; font-size: 12px; }
.deals .below { background: var(--paper); color: var(--cheap); border: 1px solid var(--rule); border-radius: 999px; padding: 3px 9px; font-weight: 600; font-size: 12px; }
.deals .dear { background: var(--paper); color: var(--dear); border: 1px solid var(--rule); border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 600; }
@media (max-width: 560px) { .deals { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .deals li { padding: 10px 10px 12px; } .deals .dn b { font-size: 19px; } .dl { padding: 18px 12px; } .deals .pill { font-size: 12.5px; padding: 4px 9px; } }
.empty { color: var(--muted); margin: 0; text-align: center; }

/* Icons inline in tables */
.ico { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--chip); margin-right: 10px; vertical-align: middle; flex: none; }
.ico svg { width: 24px; height: 24px; }

/* Watchlist table */
.nowp .card { padding: 24px 24px; }
.nowp h3 { margin: 0 0 16px; font-size: clamp(28px, 3.4vw, 40px); color: var(--accent); text-transform: uppercase; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; line-height: 1; }
.nowp h3 em, .nowp h3 .wl { font-family: var(--body); font-style: normal; font-size: 12px; font-weight: 600; text-transform: none; border-radius: 999px; padding: 4px 11px; }
.nowp h3 em { color: var(--muted); background: var(--card2); }
.nowp h3 .wl { color: var(--on-accent); background: var(--accent-ink); }
.scroll { overflow-x: auto; }
.dt { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 980px; font-size: 14px; font-variant-numeric: tabular-nums; }
.dt thead th { text-align: left; font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--rule); padding: 8px 12px; white-space: nowrap; }
.dt td, .dt tbody th { padding: 8px 12px; border-bottom: 1px solid var(--rule); text-align: left; white-space: nowrap; font-weight: 400; vertical-align: middle; }
.dt tbody th { font-weight: 600; }
.dt tbody tr:not(.dg):hover td, .dt tbody tr:not(.dg):hover th { background: var(--card2); }
.dt tr.dg td { font-family: var(--display); font-size: 24px; text-transform: uppercase; color: var(--accent); padding: 22px 12px 8px; border-bottom: 1px solid var(--rule); letter-spacing: 0.01em; }
.dt td.mx b { background: var(--accent-ink); color: var(--on-accent); border-radius: 999px; padding: 3px 11px; font-weight: 600; }
.dt .save { color: var(--bg); background: var(--ink); border-radius: 999px; padding: 3px 10px; font-weight: 600; }
.dt .ssn .sw { width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; display: inline-block; }
.dt .u, td.num .u, td.deal .u { color: var(--muted); font-size: 11.5px; }
.dt .oth { color: var(--muted); }
.dt .star { color: var(--accent); }

/* Year grid */
.yearbar { display: grid; justify-items: center; gap: 10px; text-align: center; }
.yearbar small { color: var(--muted); font-size: 13px; }
.picker { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; background: var(--card2); border-radius: 999px; padding: 4px; max-width: 100%; }
.picker button { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: transparent; border: 0; border-radius: 999px; padding: 7px 12px; cursor: pointer; }
.picker button:hover { background: var(--card3); }
.picker button[aria-pressed="true"] { background: var(--accent-ink); color: var(--on-accent); }
#grid { border-collapse: separate; border-spacing: 3px 3px; width: 100%; min-width: 1250px; font-variant-numeric: tabular-nums; }
#grid th, #grid td { padding: 0; }
#grid thead th { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding-bottom: 6px; }
#grid thead th.now { background: var(--ink); color: var(--bg); border-radius: 999px; }
#grid thead th.deal { text-align: left; padding-left: 8px; }
.grp td { font-family: var(--display); font-size: 24px; text-transform: uppercase; color: var(--accent); padding: 22px 0 6px; border-bottom: 1px solid var(--rule); letter-spacing: 0.01em; }
.name { white-space: nowrap; padding-right: 12px !important; font-size: 14px; text-align: left; font-weight: 600; }
.name i { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 400; }
td.m { width: 4.4%; height: 30px; text-align: center; vertical-align: middle; }
td.m.now { background: var(--card2); border-radius: 9px; }
td.m .sb { height: 24px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin: 0 1px; }
.star { color: var(--on-accent); font-size: 13px; line-height: 1; }
.c-f .star, .c-c .star, .c-i .star, .c-s .star, .c-g .star { color: var(--ink); }
td.num { text-align: right; white-space: nowrap; padding-left: 8px; font-size: 12.5px; }
td.num .lo { color: var(--cheap); font-weight: 700; } td.num .hi { color: var(--dear); }
td.deal { white-space: nowrap; padding: 3px 10px !important; line-height: 1.2; font-size: 11.5px; border-radius: 999px; }
td.deal.has { background: var(--deal-bg); color: var(--money); font-weight: 600; }
td.deal.best { box-shadow: inset 0 0 0 1.5px var(--accent-ink); }
td.deal .nx { color: var(--muted); font-weight: 400; }

/* Season swatches */
.sw { width: 18px; height: 12px; border-radius: 4px; display: inline-block; }
.c-P, .c-CB { background: var(--peak); }
.c-f, .c-c { background: var(--fresh); }
.c-s { background: repeating-linear-gradient(135deg, var(--store) 0 2px, var(--store-bg) 2px 5px); }
.c-g { background: transparent; box-shadow: inset 0 0 0 1.6px var(--green); }
.c-IB { background: var(--imp); }
.c-i { background: var(--imp2); }
.legend2 { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; align-items: center; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule); font-size: 12.5px; color: var(--muted); }
.legend2 span { display: inline-flex; align-items: center; gap: 7px; }
.legend2 .star { color: var(--accent); font-size: 13px; }

/* Month by month */
.page2 h2 { text-align: center; margin-top: 18px; }
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.month { padding: 18px 20px 20px; display: grid; gap: 8px; align-content: start; background: var(--paper); }
.month.now { background: var(--card2); border-color: var(--accent-ink); box-shadow: inset 0 0 0 1px var(--accent-ink); }
.month h3 { margin: 0; font-size: 30px; text-transform: uppercase; color: var(--accent); display: flex; justify-content: space-between; align-items: baseline; line-height: 1; }
.month h3 em { font-style: normal; font-family: var(--body); font-size: 12px; color: var(--muted); text-transform: none; }
.month .icons { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 4px; }
.month .icons svg { width: 34px; height: 34px; }
.month p { margin: 0; font-size: 13.5px; }
.month .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; }
.month .x { color: var(--imp); }

.src { color: var(--muted); font-size: 12px; }
.foot { font-size: 12px; color: var(--muted); margin: 0; }
.foot a { color: inherit; }

@media (max-width: 640px) {
  .tabs { width: 100%; overflow-x: auto; scrollbar-width: none; justify-content: flex-start; }
  .tabs button { padding: 9px 14px; font-size: 13px; flex: none; }
  .controls { width: 100%; }
  .storepick { flex: 1; justify-content: space-between; }
  .kpi { padding: 16px; }
}

@media print {
  @page { size: letter landscape; margin: 0.3in; }
  :root:root { --bg:#fff; --paper:#fff; --card2:#fff; --chip:#fff; color-scheme: light; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-size: 9px; }
  .wrap { padding: 0; gap: 6px; max-width: none; }
  .mast { gap: 4px; } h1 { font-size: 30px; } .lede, .brand, .controls, .tabs, .picker, .kpis, .basket, .src, #tab-deals { display: none !important; }
  .tab[hidden] { display: grid !important; }
  .sheet { border: 0; padding: 0; }
  #grid { min-width: 0; border-spacing: 1.5px 1px; } td.m { height: auto; } td.m .sb { height: 9px; border-radius: 2px; }
  .name { font-size: 7.4px; } .name i { font-size: 6.4px; } .ico { width: 12px; height: 12px; margin-right: 3px; } .ico svg { width: 10px; height: 10px; }
  .grp td, .dt tr.dg td { font-size: 9px; padding: 3px 0 0; }
  td.num, td.deal { font-size: 6.8px; } .star { font-size: 8px; }
  .dt { min-width: 0; font-size: 7.5px; } .dt td, .dt tbody th, .dt thead th { padding: 1px 4px; }
  .page2 { break-before: page; } .board { grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .month { padding: 5px 7px; gap: 2px; } .month h3 { font-size: 12px; } .month p { font-size: 7.5px; } .month .icons { display: none; }
  .card, .sheet, .month { border-radius: 6px; }
}
.kpi b { overflow-wrap: normal; hyphens: auto; }
@media (max-width: 500px) { .kpi b { font-size: 27px; } }
</style>

<div class="wrap">
  <header class="mast">

    <h1>What's good right now</h1>
    <p class="lede">What's in season around Montreal, what it usually costs, and which flyers have it on sale this week.</p>
    <span class="diamond" aria-hidden="true"></span>
    <div class="controls">
        <label class="storepick"><span>My store</span><select id="store" aria-label="My store"></select></label>
        <label class="toggle"><input type="checkbox" id="bestonly"><span class="track"><span class="knob"></span></span>Best only</label>
      </div>

      <button type="button" role="tab" data-tab="deals">This week's deals</button>

      <button type="button" role="tab" data-tab="year">Year at a glance</button>
    </nav>
  </header>

  <section class="tab" id="tab-deals" role="tabpanel">
    <div class="hero card">
      <div class="basket" id="basket" aria-hidden="true"></div>
      <div class="herotext"><h2 id="herotitle">What to buy this week</h2><p class="blurb" id="blurb"></p></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="card dl" id="dealslist"></div>
  </section>

  <section class="tab" id="tab-watch" role="tabpanel" hidden>
    <section class="nowp" id="nowp" aria-label="This week's watchlist"></section>

const iconKey = id => SVGI[id] ? id : SVGI[id.replace(/-ca$/, "")] ? id.replace(/-ca$/, "") : null;
const svgOf = id => { const k = iconKey(id); return k ? `<svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><g stroke="#5a1d26" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">${SVGI[k]}</g></svg>` : ""; };
const ic = id => `<span class="ico" aria-hidden="true">${svgOf(id)}</span>`;
// The shopper's store. "All" means the cheapest current deal at any store.
const STORE_LIST = ["Maxi", "IGA", "Metro", "Super C", "Provigo", "Adonis", "Walmart", "Avril", "Mayrand", "Marché Salaberry"];
let MY = "Maxi";
try { const v = localStorage.getItem("store"); if (v && (v === "All" || STORE_LIST.includes(v))) MY = v; } catch (e) {}
const myName = () => MY === "All" ? "any store" : MY;
function dealAt(id, st) {

  const all = Object.entries(b).map(([k, o]) => Object.assign({ store: k }, o));

}

const withStore = o => MY === "All" ? o.store + " " + o.price : o.price;
function dealCols(id) {

    const best = d.best_now === st ? " best" : "";
    const title = [o.now && (o.now.item + ", to " + o.now.to), o.next && ("next: " + o.next.item)].filter(Boolean).join("; ");

  }).join("");
}
// Regular price for a sale: the store's own regular price from the flyer when it gives one,
// otherwise the Statistics Canada Quebec average shelf price. Saving is shown only when units match.
const money = t => { const x = /\$\s*([\d.]+)/.exec(t || ""); return x ? parseFloat(x[1]) : null; };
const squash = t => (t || "").toLowerCase().replace(/\s+/g, "");
function regularOf(key, deal) {
  const p = money(deal.price);
  if (deal.reg) return { text: `$${deal.reg.toFixed(2)}`, src: "store's regular price", save: p ? 1 - p / deal.reg : null };
  if (!key || !PRICE[key]) return null;
  const [u, avg] = PRICE[key];
  const out = { text: u === "kg" ? `$${(avg / 2.2046).toFixed(2)} <span class="u">/lb avg</span>` : `$${avg.toFixed(2)} <span class="u">/${u} avg</span>`, src: "Quebec average shelf price (StatCan)", save: null };
  const bag = /^([\d.]+) ?lb (bag|box)$/.exec(u);

function blurb(m) {

function kpis(m) {
  const live = m === THIS_MONTH;
  let best = 0, top = null;
  for (const [, rows] of DATA) for (const [id, en, , code, , key] of rows) {
    if ("PfCI".includes(code[m])) best++;
    if (!live || code[m] === ".") continue;
    const o = myDeal(id);
    if (!o) continue;
    const r = regularOf(key, o);
    if (r && r.save != null && r.save < 0.9 && (!top || r.save > top.save)) top = { save: r.save, id, en, where: o.store + " " + o.price };
  }
  const tile = (cls, big, lbl, icon) => `<div class="kpi ${cls}">${icon ? `<span class="kico">${icon}</span>` : ""}<b>${big}</b><span>${lbl}</span></div>`;
  const peak = [];
  for (const [, rows] of DATA) for (const [id, en, , code, , key] of rows) {
    if (!"PC".includes(code[m])) continue;
    const o = live ? myDeal(id) : null;
    const v = indexOf(key, id, m);
    peak.push({ id, en, o, score: (o ? 0 : 1000) + (v == null ? 100 : v) });
  }
  peak.sort((a, b) => a.score - b.score);
  const f = peak[0], rest = peak.slice(1, 4).map(x => x.en.toLowerCase());
  return tile("lime", f ? f.en : "–", f ? `Freshest: local peak${f.o ? ", " + esc(f.o.store + " " + f.o.price) : ""}${rest.length ? ". Also peak: " + rest.join(", ") : ""}` : "Freshest this month", f ? svgOf(f.id) : "") +

function basket() {

      const mx = myDeal(id);
      if (!mx && code[m] === ".") continue;  // out of season and not at my store: noise
      const reg = mx ? regularOf(key, mx) : null;
      const v = indexOf(key, id, m);
      const star = code[m] !== "." && v != null && priceLevel(v) <= 2;
      items.push({ id, en, origin, c: code[m], mx, reg, v, star, other: bestOther(id) });
    }
    if (!items.length) continue;
    // Best season first, then any season, then out of season; inside each, cheapest first (sale saving, else this month's price vs usual).
    const tierOf = c => "PCI".includes(c) ? 0 : c === "." ? 2 : 1;
    const cheap = x => x.reg && x.reg.save != null ? -x.reg.save * 100 : x.v != null ? x.v - 100 : 50;
    items.sort((a, b) => tierOf(a.c) - tierOf(b.c) || cheap(a) - cheap(b) || (b.mx ? 1 : 0) - (a.mx ? 1 : 0));
    body += `<tr class="dg"><td colspan="8">${group}</td></tr>`;
    for (const x of items) {
      count++;
      const save = x.reg && x.reg.save != null && x.reg.save > 0.005 ? `<b class="save">${Math.round(x.reg.save * 100)}% off</b>` : "";
      const month = x.v == null ? "" : x.v < 100 ? `${x.star ? '<span class="star">★</span> ' : ""}${100 - x.v}% below usual` : x.v > 100 ? `${x.v - 100}% above usual` : "usual";
      body += `<tr>
        <th scope="row" class="o-${x.origin}">${ic(x.id)}${x.en}</th>
        <td class="ssn">${x.c === "." ? "" : `<i class="sw ${seasonClass(x.c)}"></i>${LABEL[x.c].replace(/^./, ch => ch.toUpperCase())}`}</td>
        <td class="mx">${x.mx ? `<b title="${esc(x.mx.item)}">${esc(withStore(x.mx))}</b>` : ""}</td>
        <td title="${x.reg ? x.reg.src : ""}">${x.reg ? x.reg.text : ""}</td>
        <td>${save}</td>
        <td>${x.mx ? esc(x.mx.to) : ""}</td>
        <td>${month}</td>
        <td class="oth">${esc(x.other)}</td></tr>`;
    }
  }
  return `<div class="card picks"><h3>This week's watchlist<span class="wl">Tasty / deals</span><em>${DEALS_DATE ? "Updated " + DEALS_DATE : ""}</em></h3>
    <div class="scroll"><table class="dt"><thead><tr><th>Item</th><th>Season now</th><th>${esc(MY === "All" ? "Best sale" : MY + " sale")}</th><th>Regular price</th><th>Saving</th><th>Until</th><th>This month vs usual</th><th>Best other store</th></tr></thead><tbody>${body || '<tr><td colspan="8">No flyer deals logged this week.</td></tr>'}</tbody></table></div></div>`;
}

// Uppercase and lowercase codes get distinct class names: class matching ignores case in some render modes.
function seasonClass(c) { return "c-" + ({ C: "CB", I: "IB" }[c] || c); }

// Toggle: keep only items at their best this month (Quebec peak or fresh, rest of Canada best, imported best).
let BEST_ONLY = false;
try { BEST_ONLY = localStorage.getItem("bestonly") === "1"; } catch (e) {}
const keep = (code, m) => !BEST_ONLY || "PfCI".includes(code[m]);
let CUR = new Date().getMonth();

function render(m) {
  CUR = m;
  let html = "<thead><tr><th></th>" + MONTHS.map((x,i)=>`<th class="${i===m?'now':''}" scope="col">${x}</th>`).join("") +
    '<th class="deal" scope="col">Maxi</th><th class="deal" scope="col">IGA</th><th class="deal" scope="col">Metro</th><th class="deal" scope="col">Other stores</th></tr></thead><tbody>';
  for (const [group, allRows] of DATA) {
    const rows = allRows.filter(r => keep(r[3], m));
    if (!rows.length) continue;
    html += `<tr class="grp"><td colspan="17">${group}</td></tr>`;
    for (const [id, en, fr, code, origin, key] of sortRows(rows, m)) {
      html += `<tr><th class="name o-${origin}" scope="row">${ic(id)}${en}<i>${fr}</i></th>`;
      const vals = MONTHS.map((_, j) => indexOf(key, id, j));
      [...code].forEach((c,i)=>{
        const cls = c === "." ? "" : seasonClass(c);
        const t = c === "." ? "" : `${en}, ${MONTHS[i]}: ${LABEL[c]}`;
        const v = vals[i];
        const p = v == null ? "" : `. Price: ${LEVEL[priceLevel(v)]} (${v > 100 ? "+" : ""}${v - 100}% vs average)`;
        html += `<td class="m ${i===m?'now':''}" title="${t || en + ", " + MONTHS[i] + ": not in season"}${p}"><div class="sb ${cls}">${c !== "." && v != null && priceLevel(v) <= 2 ? '<span class="star">★</span>' : ""}</div></td>`;
      });
      html += dealCols(id) + "</tr>";
    }
  }
  document.getElementById("grid").innerHTML = html + "</tbody>";
  renderWeek();
  document.getElementById("sub").textContent = `Showing ${MONTHS_LONG[m]}. Pick a month to re-sort; what's good that month moves to the top.`;
  document.querySelectorAll("#picker button").forEach((b,i)=>b.setAttribute("aria-pressed", String(i===m)));
  document.querySelectorAll(".month").forEach((el,i)=>el.classList.toggle("now", i===m));
}

const bestBox = document.getElementById("bestonly");
bestBox.checked = BEST_ONLY;
bestBox.addEventListener("change", () => {
  BEST_ONLY = bestBox.checked;
  try { localStorage.setItem("bestonly", BEST_ONLY ? "1" : "0"); } catch (e) {}
  render(CUR);
});
const picker = document.getElementById("picker");
MONTHS.forEach((x,i)=>{
  const b = document.createElement("button");
  b.type = "button"; b.id = "m-" + i; b.textContent = x;
  b.addEventListener("click", ()=>render(i));
  picker.appendChild(b);
});

const board = document.getElementById("board");
board.innerHTML = MONTHS.map((x,i)=>{
  const peak = [], fresh = [], store = [], ca = [], imp = [];
  for (const [, rows] of DATA) for (const [, en,, code] of rows) {
    const c = code[i];
    if (c === "P") peak.push(en); else if (c === "f") fresh.push(en); else if (c === "s") store.push(en);
    else if (c === "C") ca.push(en); else if (c === "I") imp.push(en);
  }
  const uniq = a => [...new Set(a)];
  const line = (lbl, a, cls="") => a.length ? `<div><div class="lbl ${cls}">${lbl}</div><p>${uniq(a).join(", ")}</p></div>` : "";
  const body = line("Local peak", peak.concat(ca)) + line("Local, good", fresh) + line("From storage", store) + line("Imported, at its best", imp, "x");
  const ids = [];
  for (const [, rows] of DATA) for (const [id, , , code] of rows) if ("PC".includes(code[i]) && iconKey(id) && !ids.includes(iconKey(id))) ids.push(iconKey(id));
  const icons = ids.length ? `<div class="icons" aria-hidden="true">${ids.slice(0, 8).map(svgOf).join("")}</div>` : "";
  return `<article class="month"><h3>${MONTHS_LONG[i]}<em>${MONTHS_FR[i]}</em></h3>${icons}${body || "<p>Greenhouse only.</p>"}</article>`;
}).join("");

function renderWeek() {
  const m = THIS_MONTH;
  document.getElementById("nowp").innerHTML = dealTable(m);
  document.getElementById("blurb").innerHTML = blurb(m);
  document.getElementById("kpis").innerHTML = kpis(m);
  document.getElementById("dealslist").innerHTML = dealsList();
  document.getElementById("basket").innerHTML = basket();
}

const storeSel = document.getElementById("store");
storeSel.innerHTML = STORE_LIST.map(x => `<option>${x}</option>`).join("") + '<option value="All">All stores</option>';
storeSel.value = MY;
storeSel.addEventListener("change", () => {
  MY = storeSel.value;
  try { localStorage.setItem("store", MY); } catch (e) {}
  render(CUR);
});

const TABS = ["deals", "watch", "year"];
function showTab(t) {
  if (!TABS.includes(t)) t = "deals";
  TABS.forEach(x => { document.getElementById("tab-" + x).hidden = x !== t; });
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { showTab(b.dataset.tab); try { history.replaceState(null, "", "#" + b.dataset.tab); } catch (e) {} }));
showTab((location.hash || "").slice(1));

render(new Date().getMonth());
</script>

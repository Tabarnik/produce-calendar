const LABEL = {P:"local peak", f:"local, good", s:"Quebec storage", g:"Quebec greenhouse", C:"local peak (rest of Canada)", c:"local, good (rest of Canada)", I:"imported, at its best", i:"imported, good"};
const RANK = {P:0, C:0, I:0, f:1, c:1, i:1, s:2, g:3, ".":4};
const PEAKS = "PCI";

// Months until the next peak, used to order rows that share a rank.
function distance(code, m) {
  for (let k = 0; k < 12; k++) if (PEAKS.includes(code[(m + k) % 12])) return k;
  return 12;
}
const THIS_MONTH = new Date().getMonth();
function saleOf(id) {
  const d = DEALS[id];
  if (!d) return null;
  const st = d.best_now && d[d.best_now] && d[d.best_now].now ? d.best_now : ["Maxi", "IGA", "Metro", "Other"].find(x => d[x] && d[x].now);
  if (!st) return null;
  const o = d[st].now;
  return { store: st, text: st === "Other" ? o.price : st + " " + o.price, to: o.to, item: o.item };
}
function maxiSale(id) {
  const d = DEALS[id];
  return d && d.Maxi && d.Maxi.now ? { text: "Maxi " + d.Maxi.now.price, to: d.Maxi.now.to, item: d.Maxi.now.item } : null;
}
function isStar(code, key, id, m) {
  const v = indexOf(key, id, m);
  return code[m] !== "." && v != null && priceLevel(v) <= 2;
}
function tier(row, m) {
  const [id, , , code, , key] = row;
  const season = code[m] !== ".";
  const sale = m === THIS_MONTH && saleOf(id);
  if (season && sale) return 0;
  if (isStar(code, key, id, m)) return 1;
  if (season) return 2;
  return sale ? 3 : 4;
}
function sortRows(rows, m) {
  return [...rows].sort((a, b) => {
    const t = tier(a, m) - tier(b, m);
    if (t) return t;
    const sa = isStar(a[3], a[5], a[0], m) ? 0 : 1, sb = isStar(b[3], b[5], b[0], m) ? 0 : 1;
    if (sa !== sb) return sa - sb;
    if (m === THIS_MONTH) { const xa = maxiSale(a[0]) ? 0 : 1, xb = maxiSale(b[0]) ? 0 : 1; if (xa !== xb) return xa - xb; }
    const ca = a[3], cb = b[3];
    const r = RANK[ca[m]] - RANK[cb[m]];
    if (r) return r;
    const qa = a[4] === "q" ? 0 : 1, qb = b[4] === "q" ? 0 : 1;
    if (qa !== qb) return qa - qb;
    const d = distance(ca, m) - distance(cb, m);
    if (d) return d;
    return a[1].localeCompare(b[1]);
  });
}
function indexOf(key, id, i) {
  if (key) return PRICE[key][2][i];
  return WS[id] ? WS[id][6][i] : null;
}
function priceLevel(v) { return v <= 85 ? 1 : v <= 95 ? 2 : v < 105 ? 3 : v < 115 ? 4 : 5; }
const LEVEL = ["", "much cheaper than usual", "a bit cheaper than usual", "usual price", "a bit pricier than usual", "much pricier than usual"];
function priceMark(v) { return v == null ? "" : " p" + priceLevel(v); }
function priceCols(key, id) {
  const v = MONTHS.map((_, i) => indexOf(key, id, i));
  const ok = v.map((x, i) => [x, i]).filter(([x]) => x != null);
  if (!ok.length) return '<td class="num"></td><td class="num"></td>';
  const lo = ok.reduce((a, b) => b[0] < a[0] ? b : a), hi = ok.reduce((a, b) => b[0] > a[0] ? b : a);
  return `<td class="num"><span class="lo">${MONTHS_LONG[lo[1]]}</span></td><td class="num"><span class="hi">${MONTHS_LONG[hi[1]]}</span></td>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STORES = ["Maxi", "IGA", "Metro", "Other"];
function dealCols(id) {
  const d = DEALS[id] || {};
  return STORES.map(st => {
    const o = d[st];
    if (!o) {
      if (st === "Other" && d.last) return `<td class="deal" title="${esc(d.last.item)}"><span class="nx">Last seen: ${esc(d.last.store)} ${esc(d.last.price)}, ${esc(d.last.to)}</span></td>`;

    if (o.next) h += `${h ? "<br>" : ""}<span class="nx">Next: ${esc(o.next.price)} from ${esc(o.next.from)}</span>`;
    const best = d.best_now === st ? " best" : "";
    const title = [o.now && (o.now.item + ", to " + o.now.to), o.next && ("next: " + o.next.item)].filter(Boolean).join("; ");
    return `<td class="deal has${best}" title="${esc(title)}">${h}</td>`;
  }).join("");
}
// Regular price for a sale: the store's own regular price from the flyer when it gives one,
// otherwise the Statistics Canada Quebec average shelf price. Saving is shown only when units match.
const money = t => { const x = /\$\s*([\d.]+)/.exec(t || ""); return x ? parseFloat(x[1]) : null; };
const squash = t => (t || "").toLowerCase().replace(/\s+/g, "");
function regularOf(key, deal) {
  const p = money(deal.price);
  if (deal.reg) return { text: `$${deal.reg.toFixed(2)}`, src: "store's regular price", save: p ? 1 - p / deal.reg : null };
  if (!key || !PRICE[key]) return null;
  const [u, avg] = PRICE[key];
  const out = { text: `$${avg.toFixed(2)} <span class="u">/${u} avg</span>`, src: "Quebec average shelf price (StatCan)", save: null };
  const bag = /^([\d.]+) ?lb (bag|box)$/.exec(u);
  const regLb = u === "kg" ? avg / 2.2046 : bag ? avg / parseFloat(bag[1]) : null;
  if (deal.lb && regLb) out.save = 1 - deal.lb / regLb;
  else if (p && /\d/.test(u) && squash(deal.price).includes(squash(u).replace(/(bag|box)$/, ""))) out.save = 1 - p / avg;
  else if (p && u === "each" && / each$/.test(deal.price)) out.save = 1 - p / avg;
  return out;
}
function bestOther(id) {
  const d = DEALS[id] || {};
  const st = ["IGA", "Metro", "Other"].filter(x => d[x] && d[x].now);
  if (!st.length) return "";
  const withLb = st.filter(x => d[x].now.lb);
  const pick = withLb.length ? withLb.sort((a, b) => d[a].now.lb - d[b].now.lb)[0] : st[0];
  return (pick === "Other" ? "" : pick + " ") + d[pick].now.price;
}
// The two-line "what to buy this week" note at the top.
function blurb(m) {
  const all = [];
  for (const [, rows] of DATA) for (const [id, en, , code, , key] of rows) {
    const c = code[m];
    if (c === ".") continue;
    const v = indexOf(key, id, m);
    const d = DEALS[id], mx = m === THIS_MONTH && d && d.Maxi && d.Maxi.now;
    const reg = mx ? regularOf(key, mx) : null;
    const cheap = reg && reg.save != null ? -reg.save * 100 : v != null ? v - 100 : 50;
    all.push({ id, en, best: "PCI".includes(c), v, mx, cheap, other: m === THIS_MONTH ? bestOther(id) : "" });
  }
  const byCheap = (a, b) => (b.best - a.best) || a.cheap - b.cheap;
  const atMaxi = all.filter(x => x.mx && x.cheap < 0).sort(byCheap).slice(0, 5);
  const eat = all.filter(x => !x.mx && x.best && x.v != null && x.v <= 95).sort(byCheap).slice(0, 4);
  const skip = all.filter(x => x.v != null && x.v >= 115).sort((a, b) => b.v - a.v).slice(0, 3);
  const list = a => a.length > 1 ? a.slice(0, -1).join(", ") + " and " + a[a.length - 1] : a[0] || "";
  const live = m === THIS_MONTH;

  if (live && atMaxi.length) h += `<b>Buy at Maxi this week:</b> ${list(atMaxi.map(x => `${x.en.toLowerCase()} <span class="money">${esc(x.mx.price)}</span>`))}. `;
  if (eat.length) h += `<b>${live ? "Also at their best and cheap" : "Best and cheap in " + MONTHS_LONG[m]}:</b> ${list(eat.map(x => x.en.toLowerCase() + (x.other ? ` (${esc(x.other)})` : "")))}. `;

function kpis(m) {
  const live = m === THIS_MONTH;
  let maxi = 0, best = 0, top = null;
  for (const [, rows] of DATA) for (const [id, en, , code, , key] of rows) {
    if ("PfCI".includes(code[m])) best++;
    const d = DEALS[id], mx = live && d && d.Maxi && d.Maxi.now;
    if (!mx || code[m] === ".") continue;
    maxi++;
  }
  // Best deal this week: biggest saving off regular price at any store, item in season
  if (live) for (const [, rows] of DATA) for (const [id, en, , code, , key] of rows) {
    const d = DEALS[id];
    if (!d || code[m] === ".") continue;
    for (const st of ["Maxi", "IGA", "Metro", "Other"]) {
      const o = d[st] && d[st].now;
      if (!o) continue;
      const r = regularOf(key, o);
      if (r && r.save != null && r.save < 0.9 && (!top || r.save > top.save)) top = { save: r.save, en, where: st === "Other" ? o.price : st + " " + o.price };
    }

  // Freshest: local peak this month, on sale first (Maxi first), then cheapest vs usual
  const peak = [];
  for (const [, rows] of DATA) for (const [id, en, , code, , key] of rows) {

    tile("sun", top ? Math.round(top.save * 100) + "% off" : "–", top ? `Best deal this week: ${top.en.toLowerCase()}, ${esc(top.where)}` : "Best deal this week") +
    tile("", best, "items at their best in " + MONTHS_LONG[m]) +

function dealTable(m) {

        const v = vals[i];
        const p = v == null ? "" : `. Price: ${LEVEL[priceLevel(v)]} (${v > 100 ? "+" : ""}${v - 100}% vs average)`;
        html += `<td class="m ${i===m?'now':''}" title="${t || en + ", " + MONTHS[i] + ": not in season"}${p}"><div class="sb ${cls}">${c !== "." && v != null && priceLevel(v) <= 2 ? '<span class="star">★</span>' : ""}</div></td>`;
      });
      html += dealCols(id) + "</tr>";
    }
  }
  document.getElementById("grid").innerHTML = html + "</tbody>";
  document.getElementById("nowp").innerHTML = dealTable(m);
  document.getElementById("blurb").innerHTML = blurb(m);
  document.getElementById("kpis").innerHTML = kpis(m);
  document.getElementById("sub").textContent = `${MONTHS_LONG[m]}: what's on sale and in season sits on top.`;
  document.querySelectorAll("#picker button").forEach((b,i)=>b.setAttribute("aria-pressed", String(i===m)));
  document.querySelectorAll(".month").forEach((el,i)=>el.classList.toggle("now", i===m));
}

const bestBox = document.getElementById("bestonly");
bestBox.checked = BEST_ONLY;
bestBox.addEventListener("change", () => {
  BEST_ONLY = bestBox.checked;
  try { localStorage.setItem("bestonly", BEST_ONLY ? "1" : "0"); } catch (e) {}
  render(CUR);
});
const picker = document.getElementById("picker");
MONTHS.forEach((x,i)=>{
  const b = document.createElement("button");
  b.type = "button"; b.id = "m-" + i; b.textContent = x;
  b.addEventListener("click", ()=>render(i));
  picker.appendChild(b);
});

const board = document.getElementById("board");
board.innerHTML = MONTHS.map((x,i)=>{
  const peak = [], fresh = [], store = [], ca = [], imp = [];
  for (const [, rows] of DATA) for (const [, en,, code] of rows) {
    const c = code[i];
    if (c === "P") peak.push(en); else if (c === "f") fresh.push(en); else if (c === "s") store.push(en);
    else if (c === "C") ca.push(en); else if (c === "I") imp.push(en);
  }
  const uniq = a => [...new Set(a)];
  const line = (lbl, a, cls="") => a.length ? `<div><div class="lbl ${cls}">${lbl}</div><p>${uniq(a).join(", ")}</p></div>` : "";
  const body = line("Local peak", peak.concat(ca)) + line("Local, good", fresh) + line("From storage", store) + line("Imported, at its best", imp, "x");
  return `<article class="month"><h3>${MONTHS_LONG[i]}<em>${MONTHS_FR[i]}</em></h3>${body || "<p>Greenhouse only.</p>"}</article>`;
}).join("");

render(new Date().getMonth());
</script>
